[project]
name = "cold-email-generator"
version = "0.1.0"
description = "Cold Email Generator using LLaMA 3.1, ChromaDB, LangChain and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.0",
    "streamlit>=1.35.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.2.0",
    "chromadb>=0.5.0",
    "pandas>=2.0.0",
    "unstructured>=0.14.0",
]
